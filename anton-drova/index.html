/* Hallmark · custom: warm rural woodcut · Roboto Slab + Golos Text */
:root {
 --color-paper: oklch(95% .035 83); --color-paper-deep: oklch(89% .055 78);
 --color-ink: oklch(28% .035 53); --color-muted: oklch(43% .035 57);
 --color-accent: oklch(48% .115 40); --color-rule: oklch(76% .045 74);
 --color-wood: oklch(72% .104 68); --color-wood-light: oklch(83% .083 79);
 --color-bark: oklch(36% .058 49); --color-shade: oklch(56% .08 55);
 --color-focus: oklch(43% .15 40); --color-paper-white: oklch(98% .012 83);
 --font-display: 'Roboto Slab', Georgia, serif; --font-body: 'Golos Text', sans-serif;
 --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px;
 --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;
 --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
 --ease-in-out:cubic-bezier(.65,0,.35,1); --dur-micro:120ms;
 --text-body: 1rem; --text-small: .875rem; --text-display:clamp(2.65rem,5vw,4.65rem);
}

*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);font-size:var(--text-body);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit}a:focus-visible{outline:3px solid var(--color-focus);outline-offset:6px}h1,h2,p,figure{margin:0}h1,h2{font-family:var(--font-display);font-weight:800;overflow-wrap:anywhere;min-width:0}a{white-space:nowrap} .wrap{max-width:1240px;margin:auto;padding-inline:var(--space-lg)}
.masthead{display:flex;justify-content:space-between;gap:var(--space-md);align-items:center;padding-block:var(--space-lg);border-bottom:1px solid var(--color-rule)}
.name{font-size:1rem;font-weight:600;line-height:1.35}.location{display:flex;gap:6px;align-items:center;font-size:.9rem;white-space:nowrap}.location svg{width:16px;height:20px;flex-shrink:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr);padding-top:var(--space-xl);gap:var(--space-lg)}
h1{font-size:var(--text-display);letter-spacing:-.045em;line-height:1.08;max-width:none}.price{display:flex;align-items:baseline;gap:var(--space-sm);margin-top:var(--space-lg)}.price strong{font-family:var(--font-display);font-size:clamp(3.2rem,5vw,4.65rem);letter-spacing:-.045em;font-weight:800;line-height:1.1;white-space:nowrap;color:var(--color-accent)}.price span{font-size:var(--text-body);white-space:nowrap}.lede{margin-top:var(--space-lg);max-width:30ch;font-size:1.05rem}.call{margin-top:var(--space-lg);display:inline-flex;justify-content:center;align-items:center;gap:var(--space-sm);min-height:60px;padding:var(--space-md) var(--space-lg);border:2px solid var(--color-ink);text-decoration:none;font-weight:600;font-size:1.1rem;transition:transform var(--dur-micro) var(--ease-out);width:100%;max-width:360px;background:var(--color-ink);color:var(--color-paper)}.call svg{width:22px;height:22px}.call:hover{background:var(--color-bark)}.call:active{transform:translateY(1px)}.anytime{font-size:var(--text-small);margin-top:var(--space-xs);color:var(--color-muted)}
.illustration{display:flex;align-items:center;position:relative;min-width:0}.wood-art{width:100%;height:auto;display:block}.illustration:after{content:"";position:absolute;width:84%;height:76%;background:var(--color-paper-deep);z-index:-1;border-radius:50%;left:6%;top:7%}.illustration{isolation:isolate}
.details{display:grid;gap:var(--space-lg);padding-block:var(--space-lg) var(--space-xl);margin-top:var(--space-lg);border-top:1px solid var(--color-rule)}.details h2{font-size:1.35rem;line-height:1.3}.details p{font-size:var(--text-body);color:var(--color-muted);max-width:45ch}.foot{border-top:1px solid var(--color-rule);padding-block:var(--space-lg);display:flex;flex-wrap:wrap;gap:var(--space-xs) var(--space-lg);justify-content:space-between;font-size:var(--text-small);color:var(--color-muted)}.foot a{text-underline-offset:4px}.foot a:hover{color:var(--color-accent)}
@media(min-width:48rem){.wrap{padding-inline:var(--space-xl)}.masthead{padding-block:32px}.name{font-size:1.1rem}.location{font-size:1rem}.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;padding-block:var(--space-2xl) var(--space-xl);align-items:center}.hero-copy{position:relative;z-index:1}.illustration{width:112%;margin-left:-6%}.details{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;padding-block:var(--space-xl)}.details h2{font-size:1.5rem;max-width:25ch}.details p{justify-self:end}.foot{padding-block:32px}}
@media(min-width:75rem){.hero{padding-top:80px;padding-bottom:var(--space-2xl)}.lede{font-size:1.15rem}.call{font-size:1.2rem;min-height:64px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{@page{size:A4;margin:14mm}body{background:var(--color-paper-white)}.wrap{max-width:none;padding:0}.masthead{padding-top:0}.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:32px;gap:16px}.hero h1{font-size:38px}.price strong{font-size:42px}.price{flex-wrap:wrap}.lede{font-size:15px}.call{font-size:16px;padding:12px;background:none;color:var(--color-ink);min-height:48px}.illustration{width:100%;margin:0}.details{margin-top:24px;padding-block:20px;gap:12px}.details h2{font-size:20px}.details p{font-size:14px}.foot{padding-block:16px}header,.hero,.details,footer{break-inside:avoid}}
</style></head>
